name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install verified Inno Setup 7
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
            throw "Inno Setup signature verification failed: $($signature.Status)"
          }
          $process = Start-Process -FilePath $installer -ArgumentList '/CURRENTUSER','/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }

      - name: Build installer and portable release
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Exercise clean install, upgrade and uninstall
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./companion/CodexWallpaperSkin.Companion.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version | Select-Object -First 1
          ./scripts/installer-smoke-test.ps1 -SetupPath "./dist/CodexWallpaperSkin-Setup-v$version-win-x64.exe"

      - name: Check out the current stable baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: previous-stable

      - name: Inspect cross-version baseline
        id: baseline
        shell: pwsh
        run: |
          [xml]$currentProject = Get-Content ./companion/CodexWallpaperSkin.Companion.csproj -Raw
          [xml]$previousProject = Get-Content ./previous-stable/companion/CodexWallpaperSkin.Companion.csproj -Raw
          $current = [version]([string]$currentProject.Project.PropertyGroup.Version | Select-Object -First 1)
          $previous = [version]([string]$previousProject.Project.PropertyGroup.Version | Select-Object -First 1)
          $upgradeRequired = ($previous -lt $current).ToString().ToLowerInvariant()
          "current_version=$current" >> $env:GITHUB_OUTPUT
          "previous_version=$previous" >> $env:GITHUB_OUTPUT
          "upgrade_required=$upgradeRequired" >> $env:GITHUB_OUTPUT

      - name: Build stable baseline installer
        if: steps.baseline.outputs.upgrade_required == 'true'
        shell: pwsh
        run: ./previous-stable/scripts/build-installer.ps1

      - name: Exercise stable-to-candidate upgrade
        if: steps.baseline.outputs.upgrade_required == 'true'
        shell: pwsh
        run: |
          $previous = '${{ steps.baseline.outputs.previous_version }}'
          $current = '${{ steps.baseline.outputs.current_version }}'
          ./scripts/installer-cross-version-smoke-test.ps1 `
            -PreviousSetupPath "./previous-stable/dist/CodexWallpaperSkin-Setup-v$previous-win-x64.exe" `
            -CurrentSetupPath "./dist/CodexWallpaperSkin-Setup-v$current-win-x64.exe"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: CodexWallpaperSkin-windows-release-candidate
          if-no-files-found: error
          path: |
            dist/CodexWallpaperSkin-Setup-v*-win-x64.exe
            dist/CodexWallpaperSkin-Setup-v*-win-x64.exe.sha256
            dist/CodexWallpaperSkin-v*-portable-win-x64.zip
            dist/CodexWallpaperSkin-v*-portable-win-x64.zip.sha256
            dist/CodexWallpaperSkin-v*-release-manifest.json
            dist/CodexWallpaperSkin-v*-release-manifest.json.sha256
